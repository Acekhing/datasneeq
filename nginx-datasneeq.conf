# Add these location blocks to both server blocks (port 80 and 443)
# in your portal.stpis.edu.gh nginx config, before the catch-all "location /"

    location /datasneeq-api/ {
        set $datasneeq_api http://datasneeq-api:5041;
        rewrite ^/datasneeq-api/(.*) /$1 break;
        proxy_pass $datasneeq_api;
    }

    location /datasneeq/ {
        proxy_pass http://datasneeq-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
